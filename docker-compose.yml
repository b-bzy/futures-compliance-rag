# 一条命令起 API + UI：
#     cp .env.example .env   # 填入 DEEPSEEK_API_KEY
#     docker compose up
#
# UI  http://localhost:8501
# API http://localhost:8000/docs
#
# 前置条件：data/ 下已有索引（chroma 集合 derivrag_clauses + bm25 索引）。
# 没有的话先在宿主机跑 scripts/01_crawl.py → 02_parse.py → 03_build_index.py。
#
# 不含 ollama 服务：生成走 DeepSeek API（configs/config.yaml 的 llm.provider）。
# 若要改回本地 ollama，把 provider 换成 ollama，并让容器能访问宿主机的 11434 端口。

name: futures-compliance-rag

services:
  api:
    build: .
    image: futures-compliance-rag:latest
    ports:
      - "8000:8000"
    env_file:
      - .env          # DEEPSEEK_API_KEY 等密钥，不进镜像
    volumes:
      # 语料与索引：292M，随抓取更新，不适合打进镜像
      - ./data:/app/data
      # 模型缓存：bge-m3 + reranker 约 3G，重建镜像时不必重新下载
      - hf-cache:/app/.cache/huggingface
    healthcheck:
      # 用 /health 而不是根路径 —— HTTP 200 不等于索引就绪，
      # 这个端点会真的去数向量条数（详见 docs/decisions.md D13）
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      # 首次请求要懒加载 bge-m3 + reranker，给足冷启动时间
      start_period: 180s
      retries: 5
    restart: unless-stopped

  ui:
    build: .
    image: futures-compliance-rag:latest
    command: >
      streamlit run src/derivrag/ui/app.py
      --server.address 0.0.0.0
      --server.port 8501
      --browser.gatherUsageStats false
    ports:
      - "8501:8501"
    environment:
      # 界面只通过 HTTP 访问后端，自身不加载模型
      DERIVRAG_API_URL: http://api:8000
    volumes:
      # 「效果与取舍」页面要读评测报告与决策记录
      - ./eval/reports:/app/eval/reports:ro
      - ./docs:/app/docs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf-cache:
