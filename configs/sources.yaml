# =====================================================================
# 已验证的死路 —— 不要再尝试 (记录在此以免重复踩坑)
# =====================================================================
dead_ends:
  - url: https://www.theocc.com/
    reason: 对 plain curl / Chrome UA / 完整 Sec-Fetch 头组合均 403，getmedia 与 getcontentasset 路径同样 403
  - url: http://www.e-cffex.com.cn/web/gzqq1/
    reason: 百问百答的文章正文是单张 JPG，是唯一真正需要 OCR 的语料；cffex.com.cn/cn/cjwd1.html 已覆盖同样内容且是纯文本
  - url: https://www.cmegroup.com/content/dam/cmegroup/rulebook/
    reason: 所有 chapter PDF 路径均 403；contractSpecs.options.html 的条款值不在 HTML 里，只有列名在 data-all-labels-option 属性中
  - url: https://www.finra.org/investors/
    reason: 对 curl 所有 header 组合 403，仅 headless 浏览器可取；investor.gov 已覆盖且为公有领域
  - url: https://www.isda.org/
    reason: 2021 IRD / 2002 Equity Derivatives Definitions 付费墙($350 会员/$700 非会员)。免费替代已收录 2002 ISDA Master Agreement
  - url: http://www.isc.com.cn/
    reason: 中证中小投资者服务中心的"行权"指股东投票权，非期权行权 —— 同形词陷阱，入库会污染检索
  - url: https://www.sgx.com/sites/default/files/
    reason: 返回 200 但 Content-Type 是 text/html(SPA 壳)，不是 PDF。真实文件只在 api2.sgx.com
  - url: https://query.sse.com.cn/search/getESSearchDoc.do
    reason: 返回 200 JSON 但内容恒为 success=false / error=系统繁忙

# api2.sgx.com robots.txt = Disallow: /  -> 以下 3 个文件仅供手工下载，不纳入爬虫
